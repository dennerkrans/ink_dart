name: ink_dart
description: >-
  Pure Dart runtime for inkle's ink narrative scripting language. Plays
  stories compiled to ink's JSON format, checked against the C# reference
  runtime: same text, choices, randomness and save files.
version: 0.1.0
topics:
  - ink
  - interactive-fiction
  - narrative
  - games

environment:
  sdk: ^3.12.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
