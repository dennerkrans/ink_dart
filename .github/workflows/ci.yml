name: ci

on:
  push:
  pull_request:

jobs:
  ink_dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ink_dart
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Conformance, AOT-compiled
        run: dart test --compiler exe test/conformance
      - name: Package validation
        run: dart pub publish --dry-run

  flutter_ink:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter_ink
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Example app
        working-directory: packages/flutter_ink/example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
          flutter build web
